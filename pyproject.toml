[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uap-footage-analyzer"
version = "0.1.0"
description = "Experimental OpenCV pipeline for extracting high motion-delta events from publicly released UAP footage datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Aaron Marchant" }
]
dependencies = [
  "opencv-python",
  "numpy"
]

[project.scripts]
uap-v3 = "src.sky_residual_v3:main"
